name: Compiler la passerelle Windows

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/build-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Compiler la passerelle V2.6
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Passerelle-Mariage-Alexandra-Lucas" `
            --paths gateway `
            gateway/mariage_gateway_v26.py
      - name: Créer le pack ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          Copy-Item dist/Passerelle-Mariage-Alexandra-Lucas.exe pack/
          @'
          PASSERELLE MARIAGE ALEXANDRA & LUCAS — V2.6

          Nouveautés :
          - annonces et programme en direct ;
          - livre d’or multimédia et galerie souvenirs ;
          - binômes inter-familles et défis photo partagés ;
          - quatre jeux déverrouillés définitivement par QR code ;
          - tableau de bord administrateur et suivi NAS ;
          - quiz DJ de 15 questions Elle ou Lui ;
          - une réponse commune par table et scores en direct ;
          - horaires automatiques des animations ;
          - configuration manuelle des binômes et équipes ;
          - film souvenir et sélection multiple des participants ;
          - stories photo et vidéo ;
          - texte et autocollants déplaçables après capture ;
          - suppression logique des photos et stories ;
          - conservation permanente des éléments retirés sur le NAS ;
          - logo officiel sur l'accueil et l'icône de l'application.

          Port : 8788
          NAS : X:\Mariage_Alexandra_Lucas

          Lancez cette application normalement, sans mode administrateur.
          '@ | Set-Content -Encoding UTF8 pack/LISEZ-MOI.txt
          Compress-Archive -Path pack/* -DestinationPath Passerelle-Mariage-Alexandra-Lucas-Windows.zip -Force
      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Passerelle-Mariage-Alexandra-Lucas-Windows-V2.6
          path: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
      - name: Publier la version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gateway-v2.6
          name: Passerelle Mariage Windows V2.6
          body: |
            Horaires automatiques, groupes manuels, film souvenir et correction de la navigation.
          files: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
          make_latest: true
