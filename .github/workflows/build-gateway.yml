name: Compiler la passerelle Windows

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/build-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compiler l'exécutable V1.4
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Passerelle-Mariage-Alexandra-Lucas" `
            --paths gateway `
            gateway/mariage_gateway_v14.py

      - name: Créer le pack ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          Copy-Item dist/Passerelle-Mariage-Alexandra-Lucas.exe pack/
          @'
          PASSERELLE MARIAGE ALEXANDRA & LUCAS — V1.4

          Cette version peut fonctionner en même temps que la passerelle ERP ASM.

          Ports :
          - ERP ASM : 8787
          - Mariage : 8788

          La passerelle mariage doit être lancée normalement, sans mode administrateur,
          afin de conserver l'accès au lecteur réseau :
          X:\Mariage_Alexandra_Lucas

          Étapes :
          1. Fermez l'ancienne passerelle mariage.
          2. Vérifiez que X: est visible dans l'Explorateur Windows.
          3. Lancez normalement Passerelle-Mariage-Alexandra-Lucas.exe.
          4. Cliquez sur Tester le NAS.
          5. Cliquez sur Démarrer.

          Test local :
          http://127.0.0.1:8788/api/health

          Application web :
          https://alpesex.github.io/Alexandra-Lucas-Mariage/
          '@ | Set-Content -Encoding UTF8 pack/LISEZ-MOI.txt
          Compress-Archive -Path pack/* -DestinationPath Passerelle-Mariage-Alexandra-Lucas-Windows.zip -Force

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Passerelle-Mariage-Alexandra-Lucas-Windows-V1.4
          path: Passerelle-Mariage-Alexandra-Lucas-Windows.zip

      - name: Publier la version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gateway-v1.4
          name: Passerelle Mariage Windows V1.4
          body: |
            Correction du conflit avec la passerelle ERP ASM.
            La passerelle mariage utilise désormais le port 8788 et fonctionne sans élévation administrateur.
          files: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
          make_latest: true
