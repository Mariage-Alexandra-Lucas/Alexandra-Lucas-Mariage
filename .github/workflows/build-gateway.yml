name: Compiler la passerelle Windows

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/build-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Appliquer la configuration V1.3 sans administrateur
        shell: pwsh
        run: |
          $file = 'gateway/mariage_gateway.py'
          $content = Get-Content $file -Raw
          $content = $content.Replace('VERSION = "1.0.0"', 'VERSION = "1.3.0"')
          $content = $content.Replace('r"\\\\192.168.1.131\\Mariage_Alexandra_Lucas"', 'r"X:\\Mariage_Alexandra_Lucas"')
          $content = $content.Replace('GatewayServer(("0.0.0.0", PORT), GatewayHandler, self.config)', 'GatewayServer(("127.0.0.1", PORT), GatewayHandler, self.config)')
          Set-Content -Path $file -Value $content -Encoding UTF8

      - name: Compiler l'exécutable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Passerelle-Mariage-Alexandra-Lucas" `
            gateway/mariage_gateway.py

      - name: Créer le pack ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          Copy-Item dist/Passerelle-Mariage-Alexandra-Lucas.exe pack/
          @'
          PASSERELLE MARIAGE ALEXANDRA & LUCAS — V1.3

          Cette version doit être lancée normalement, sans « Exécuter en tant qu’administrateur ».

          Dossier NAS :
          X:\Mariage_Alexandra_Lucas

          Pourquoi : Windows masque souvent les lecteurs réseau montés dans une session administrateur.
          La passerelle écoute désormais uniquement sur 127.0.0.1:8787 et ne demande plus d’élévation.

          Étapes :
          1. Vérifiez que X: est visible dans l’Explorateur Windows.
          2. Lancez normalement Passerelle-Mariage-Alexandra-Lucas.exe.
          3. Cliquez sur Tester le NAS.
          4. Cliquez sur Démarrer.

          Application web :
          https://alpesex.github.io/Alexandra-Lucas-Mariage/
          '@ | Set-Content -Encoding UTF8 pack/LISEZ-MOI.txt
          Compress-Archive -Path pack/* -DestinationPath Passerelle-Mariage-Alexandra-Lucas-Windows.zip -Force

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Passerelle-Mariage-Alexandra-Lucas-Windows-V1.3
          path: Passerelle-Mariage-Alexandra-Lucas-Windows.zip

      - name: Publier la version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gateway-v1.3
          name: Passerelle Mariage Windows V1.3
          body: |
            Correction du conflit entre le mode administrateur Windows et le lecteur réseau X:.
            Cette version fonctionne sans élévation et utilise X:\Mariage_Alexandra_Lucas.
          files: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
          make_latest: true
