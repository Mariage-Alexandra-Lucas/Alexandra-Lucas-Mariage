name: Compiler la passerelle Windows

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/build-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de la passerelle
        run: python -m pip install --upgrade pip pyinstaller pillow pillow-heif imageio-ffmpeg
      - name: Compiler la passerelle V2.9.0
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Passerelle-Mariage-Alexandra-Lucas" `
            --paths gateway `
            --collect-all imageio_ffmpeg `
            --collect-all pillow_heif `
            gateway/mariage_gateway_v29.py
      - name: Créer le pack ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          Copy-Item dist/Passerelle-Mariage-Alexandra-Lucas.exe pack/
          @'
          PASSERELLE MARIAGE ALEXANDRA & LUCAS — V2.9.0

          Nouveautés :
          - livre d’or souvenir directement en vidéo MP4 portrait ;
          - vidéo personnalisée de 10 à 20 photos pour chaque invité selon les photos de l'invité, de son binôme et de son équipe ;
          - livre d’or global Alexandra & Lucas jusqu’à 50 photos ;
          - sélection automatique et équilibrée entre les participants ;
          - détection perceptuelle des photos identiques ou trop similaires ;
          - commentaires automatiques selon le contexte de la photo ;
          - mise en page portrait 9:16 avec police élégante et fond photographique ;
          - prise en charge JPG, PNG, WebP et HEIC/HEIF ;
          - génération à la demande et cache automatique sur le NAS ;
          - téléchargement direct du fichier .mp4 depuis l’application.

          Port : 8788
          NAS : X:\Mariage_Alexandra_Lucas

          Lancez cette application normalement, sans mode administrateur.
          '@ | Set-Content -Encoding UTF8 pack/LISEZ-MOI.txt
          Compress-Archive -Path pack/* -DestinationPath Passerelle-Mariage-Alexandra-Lucas-Windows.zip -Force
      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Passerelle-Mariage-Alexandra-Lucas-Windows-V2.9.0
          path: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
      - name: Publier la version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gateway-v2.9.0
          name: Passerelle Mariage Windows V2.9.0
          body: |
            Livre d’or vidéo portrait MP4 avec sélection automatique des photos, déduplication visuelle et commentaires contextuels.
          files: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
          make_latest: true
