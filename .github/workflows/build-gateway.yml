name: Compiler la passerelle Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/build-gateway.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compiler l'exécutable autonome
        run: dotnet publish gateway/MariageGateway.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - name: Créer le pack ZIP
        shell: pwsh
        run: |
          Copy-Item gateway/LISEZ-MOI.txt dist/LISEZ-MOI.txt
          Compress-Archive -Path dist/* -DestinationPath Passerelle-Mariage-Alexandra-Lucas-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Passerelle-Mariage-Alexandra-Lucas-Windows
          path: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
      - name: Publier la version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gateway-v1.2
          name: Passerelle Mariage V1.2
          files: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
          make_latest: true
