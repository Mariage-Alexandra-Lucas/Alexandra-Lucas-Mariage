name: Compiler la passerelle Windows

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/build-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Compiler la passerelle V2.1
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Passerelle-Mariage-Alexandra-Lucas" `
            --paths gateway `
            gateway/mariage_gateway_v21.py
      - name: Créer le pack ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          Copy-Item dist/Passerelle-Mariage-Alexandra-Lucas.exe pack/
          @'
          PASSERELLE MARIAGE ALEXANDRA & LUCAS — V2.1

          Nouveautés :
          - dépôt et consultation plein écran des photos ;
          - stories enrichies avec texte, stickers et effets ;
          - suppression des stories de l'application ;
          - archivage permanent des stories supprimées sur le NAS.

          Port : 8788
          NAS : X:\Mariage_Alexandra_Lucas

          Lancez cette application normalement, sans mode administrateur.
          '@ | Set-Content -Encoding UTF8 pack/LISEZ-MOI.txt
          Compress-Archive -Path pack/* -DestinationPath Passerelle-Mariage-Alexandra-Lucas-Windows.zip -Force
      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Passerelle-Mariage-Alexandra-Lucas-Windows-V2.1
          path: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
      - name: Publier la version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gateway-v2.1
          name: Passerelle Mariage Windows V2.1
          body: |
            Photos avec prévisualisation, stories enrichies et suppression avec archivage NAS.
          files: Passerelle-Mariage-Alexandra-Lucas-Windows.zip
          make_latest: true
